<style>

.container{max-width:1440px;margin:0 auto;padding:20px}

.kpi-card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card:nth-child(1)::before{background:#4361ee}
.kpi-card:nth-child(2)::before{background:#f72585}
.kpi-card:nth-child(3)::before{background:#4cc9f0}
.kpi-card:nth-child(4)::before{background:#f9844a}
.kpi-card:nth-child(5)::before{background:#90be6d}
.kpi-label{font-size:13px;color:#666;margin-bottom:8px}
.kpi-value{font-size:28px;font-weight:700}
.kpi-sub{font-size:12px;color:#999;margin-top:4px}
.section{background:#fff;border-radius:10px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.section-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:18px;background:#4361ee;border-radius:2px}
.flow-container{display:flex;align-items:center;justify-content:center;padding:20px 0;flex-wrap:wrap}
.flow-node{border:2px solid;border-radius:12px;padding:14px 20px;text-align:center;min-width:160px;position:relative;background:#fff}
.flow-node .fn-title{font-size:14px;font-weight:600;margin-bottom:4px}
.flow-node .fn-stats{font-size:12px;color:#666}
.flow-arrow{width:60px;height:2px;background:#ccc;position:relative;margin:0 4px}
.flow-arrow::after{content:'▶';position:absolute;right:-6px;top:-8px;color:#ccc;font-size:14px}
.flow-arrow .arrow-label{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:#999;white-space:nowrap}
.gantt-wrapper{overflow-x:auto}
.gantt-table{width:100%;border-collapse:collapse;min-width:900px}
.gantt-table th{background:#f8f9fa;padding:10px 12px;text-align:left;font-size:13px;font-weight:600;border-bottom:2px solid #e9ecef;position:sticky;top:0}
.gantt-table td{padding:8px 12px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle}
.gantt-table tr:hover{background:#f8f9ff}
.gantt-bar-container{position:relative;height:28px;background:#f5f5f5;border-radius:4px;min-width:200px}
.gantt-bar{position:absolute;height:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:500;min-width:2px;transition:opacity .2s}
.gantt-bar:hover{opacity:.85}
.status-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.status-badge.done{background:#d4edda;color:#155724}
.status-badge.pending{background:#fff3cd;color:#856404}
.status-badge.rejected{background:#f8d7da;color:#721c24}
.status-badge.withdrawn{background:#e2e3e5;color:#383d41}
.status-badge.draft{background:#e9ecef;color:#495057}
.node-flow-mini{display:flex;align-items:center;gap:4px;margin:4px 0}
.node-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.node-dot.done{background:#28a745}
.node-dot.pending{background:#ffc107}
.node-dot.active{background:#007bff}
.node-line{width:16px;height:2px;background:#dee2e6}
.detail-panel{display:none;position:fixed;top:0;right:0;width:480px;height:100%;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:1000;overflow-y:auto;padding:24px}
.detail-panel.show{display:block}
.detail-panel .close-btn{position:absolute;top:16px;right:16px;cursor:pointer;font-size:20px;color:#999}
.detail-panel .close-btn:hover{color:#333}
.detail-node{border:1px solid #e9ecef;border-radius:8px;padding:14px;margin-bottom:12px}
.detail-node .dn-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.detail-node .dn-title{font-weight:600;font-size:14px}
.detail-node .dn-time{font-size:12px;color:#666}

.detail-node .dn-bar-fill{height:100%;border-radius:3px}
.filter-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{padding:6px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.filter-bar label{font-size:13px;color:#666}

.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#666}
.legend-color{width:14px;height:14px;border-radius:3px}
.node-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.node-stat-card{background:#f8f9fa;border-radius:8px;padding:14px;border-left:3px solid}
.node-stat-card .ns-name{font-size:13px;font-weight:600;margin-bottom:6px}
.node-stat-card .ns-row{display:flex;justify-content:space-between;font-size:12px;color:#666;margin-top:2px}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:999}
.overlay.show{display:block}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid #e9ecef}

.tab.active{color:#4361ee;border-bottom-color:#4361ee;font-weight:600}
.tab:hover{color:#4361ee}

    </div>
  </div>
</div>

<!-- Detail Panel -->
<div class="overlay" id="overlay" onclick="closeDetail()"></div>

// Flow Diagram
function renderFlow() {
  const processes = [
    { name: '面料质量&时效异常', code: 'LC260416001', nodes: ['面料组接收处理异常','面料组完成异常处理','订单组确认异常处理结果'] },
    { name: '辅料质量&时效异常', code: 'LC260424001', nodes: ['辅料组接收处理异常','辅料组完成异常处理','订单组确认异常处理结果'] },
    { name: '面料数量异常', code: 'LC260417001', nodes: ['面料组接收处理异常(数量)','面料组接收处理异常','订单组确认异常处理结果(数量)'] },
  ];
  
  const tabsEl = document.getElementById('flowTabs');
  tabsEl.innerHTML = processes.map((p,i) => `<div class="tab ${i===0?'active':''}" onclick="switchFlow(${i})">${p.name}</div>`).join('');
  
  window._flows = processes;
  switchFlow(0);
}

function switchFlow(idx) {
  document.querySelectorAll('#flowTabs .tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  const p = window._flows[idx];
  const ns = DATA.node_stats;
  
  let html = '<div class="flow-container">';
  p.nodes.forEach((n, i) => {
    const stats = ns[n] || {};
    const color = COLORS[n] || '#666';
    html += `
      <div class="flow-node" style="border-color:${color}">
        <div class="fn-title" style="color:${color}">${n}</div>
        <div class="fn-stats">
          ${stats.avg ? `平均: ${stats.avg}h<br>最长: ${stats.max}h | 样本: ${stats.count}` : '暂无数据'}
        </div>
      </div>
    `;
    if (i < p.nodes.length - 1) {
      html += `<div class="flow-arrow"><div class="arrow-label">流转</div></div>`;
    }
  });
  html += '</div>';
  document.getElementById('flowContent').innerHTML = html;
}

// Node Stats
function renderNodeStats() {
  const ns = DATA.node_stats;
  const colors = Object.values(COLORS);
  let i = 0;
  document.getElementById('nodeStatsGrid').innerHTML = Object.entries(ns).map(([name, s]) => {
    const c = COLORS[name] || colors[i++ % colors.length];
    return `
      <div class="node-stat-card" style="border-left-color:${c}">
        <div class="ns-name" style="color:${c}">${name}</div>
        <div class="ns-row"><span>平均时长</span><span>${s.avg}h</span></div>
        <div class="ns-row"><span>最长时长</span><span>${s.max}h</span></div>
        <div class="ns-row"><span>最短时长</span><span>${s.min}h</span></div>
        <div class="ns-row"><span>样本数</span><span>${s.count}</span></div>
      </div>
    `;
  }).join('');
}

// Gantt Chart
function renderGantt() {
  const fp = document.getElementById('filterProcess').value;
  const fs = document.getElementById('filterStatus').value;
  const fo = document.getElementById('filterOrder').value.trim();
  
  let orders = DATA.orders.filter(o => {
    if (fp && o.process_name !== fp) return false;
    if (fs && o.status !== fs) return false;
    if (fo && !o.order_no.includes(fo)) return false;
    return true;
  });
  
  orders = orders.slice(0, 30);
  
  // 计算全局时间范围
  let allTimes = [];
  orders.forEach(o => o.nodes.forEach(n => {
    if (n.gmt_create) allTimes.push(new Date(n.gmt_create));
    if (n.gmt_modified) allTimes.push(new Date(n.gmt_modified));
  }));
  if (!allTimes.length) { document.getElementById('ganttBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#999">无匹配数据</td></tr>'; return; }
  
  const minTime = new Date(Math.min(...allTimes));
  const maxTime = new Date(Math.max(...allTimes));
  const totalSpan = maxTime - minTime || 1;
  
  document.getElementById('ganttBody').innerHTML = orders.map(o => {
    const statusClass = STATUS_MAP[o.status] || 'draft';
    let bars = '';
    o.nodes.forEach(n => {
      if (!n.gmt_create) return;
      const start = new Date(n.gmt_create);
      const end = n.gmt_modified ? new Date(n.gmt_modified) : start;
      const left = ((start - minTime) / totalSpan * 100).toFixed(2);
      const width = Math.max(0.5, ((end - start) / totalSpan * 100)).toFixed(2);
      const color = COLORS[n.node_name] || '#999';
      const title = `${n.node_name}: ${n.duration_hours||'?'}h`;
      bars += `<div class="gantt-bar" style="left:${left}%;width:${width}%;background:${color}" title="${title}"></div>`;
    });
    
    const nodeFlow = o.nodes.map(n => {
      const c = COLORS[n.node_name] || '#999';
      return `<span class="node-dot" style="background:${c}" title="${n.node_name}"></span>`;
    }).join('<span class="node-line"></span>');
    
    return `<tr>
      <td><strong>${o.order_no}</strong></td>
      <td title="${o.supplier}">${o.supplier.substring(0,6)}...</td>
      <td><span class="status-badge ${statusClass}">${o.status}</span></td>
      <td style="font-size:12px">${o.process_name||'-'}</td>
      <td><div class="gantt-bar-container">${bars}</div><div class="node-flow-mini">${nodeFlow}</div></td>
      <td>${o.total_hours||'-'}</td>
      <td><button onclick="showDetail('${o.order_no}')" style="padding:2px 10px;background:#4361ee;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px">查看</button></td>
    </tr>`;
  }).join('');
}

function resetFilter() {
  document.getElementById('filterProcess').value = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterOrder').value = '';
  renderGantt();
}

// Detail Panel
function showDetail(orderNo) {
  const o = DATA.orders.find(x => x.order_no === orderNo);
  if (!o) return;
  
  const maxDur = Math.max(...o.nodes.map(n => n.duration_hours || 0), 1);
  
  let nodesHtml = o.nodes.map(n => {
    const color = COLORS[n.node_name] || '#999';
    const pct = n.duration_hours ? (n.duration_hours / maxDur * 100).toFixed(0) : 0;
    let fieldsHtml = '';
    if (n.fields && n.fields.length) {
      fieldsHtml = n.fields.map(f => `<div style="font-size:12px;color:#666;margin-top:4px"><strong>${f.field_name}:</strong> ${f.field_value||'-'}</div>`).join('');
    }
    return `
      <div class="detail-node">
        <div class="dn-header">
          <span class="dn-title" style="color:${color}">● ${n.node_name}</span>
          <span class="status-badge ${n.status===3?'done':'pending'}">${n.status===3?'已完成':'处理中'}</span>
        </div>
        <div class="dn-time">
          创建: ${n.gmt_create||'-'}<br>
          完成: ${n.gmt_modified||'-'}<br>
          处理人ID: ${n.handler_id||'-'} | 耗时: <strong>${n.duration_hours||'?'}h</strong>
        </div>
        <div class="dn-bar"><div class="dn-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        ${fieldsHtml}
      </div>
    `;
  }).join('');
  
  document.getElementById('detailContent').innerHTML = `
    <h3 style="margin-bottom:4px">${o.order_no}</h3>
    <div style="font-size:13px;color:#666;margin-bottom:16px">
      ${o.supplier} | ${o.process_name||'-'} | ${o.status}<br>
      <strong>异常描述:</strong> ${o.exception_desc}<br>
      <strong>异常原因:</strong> ${o.reason_1} > ${o.reason_2} > ${o.reason_3}<br>
      <strong>采购员:</strong> ${o.purchaser||'-'} | <strong>总耗时:</strong> ${o.total_hours||'?'}h
    </div>
    <div class="section-title" style="font-size:14px">节点详情</div>
    ${nodesHtml}
  `;
  document.getElementById('detailPanel').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// Init filters
function initFilters() {
  const ps = new Set(DATA.orders.map(o => o.process_name).filter(Boolean));
  const ss = new Set(DATA.orders.map(o => o.status));
  const sel1 = document.getElementById('filterProcess');
  const sel2 = document.getElementById('filterStatus');
  ps.forEach(p => { const opt = document.createElement('option'); opt.value = p; opt.textContent = p; sel1.appendChild(opt); });
  ss.forEach(s => { const opt = document.createElement('option'); opt.value = s; opt.textContent = s; sel2.appendChild(opt); });
}

// Init
renderKPI();
renderFlow();
renderNodeStats();
initFilters();
renderGantt();
</script>
</body>
</html>
